
networks:
  priceping_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: priceping_db
    restart: unless-stopped
    networks:
      - priceping_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-pricewatch_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pricewatch} -d ${POSTGRES_DB:-pricewatch_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache & Celery Broker)
  redis:
    image: redis:7-alpine
    container_name: priceping_redis
    restart: unless-stopped
    networks:
      - priceping_network
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: priceping-backend:latest
    container_name: priceping_backend
    restart: unless-stopped
    networks:
      - priceping_network
    shm_size: '1gb'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pricewatch}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-pricewatch_db}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # BUG-021 FIX: Added --workers 4 for multi-threaded production throughput.
    # Single-worker uvicorn is only appropriate for development.
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Celery Worker (Scraper Pipeline with Playwright)
  worker:
    # BUG-022 FIX: Reuse the already-built backend image instead of rebuilding.
    image: priceping-backend:latest
    container_name: priceping_worker
    restart: unless-stopped
    networks:
      - priceping_network
    shm_size: '1gb'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pricewatch}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-pricewatch_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=4

  # Celery Beat (Periodic Schedule Monitor)
  beat:
    # BUG-022 FIX: Reuse the already-built backend image instead of rebuilding.
    image: priceping-backend:latest
    container_name: priceping_beat
    restart: unless-stopped
    networks:
      - priceping_network
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pricewatch}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-pricewatch_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    command: celery -A worker.celery_app beat --loglevel=info

  # Flower (Celery Monitoring Dashboard)
  flower:
    # BUG-022 FIX: Reuse the already-built backend image instead of rebuilding.
    # BUG-023 FIX: Added --basic_auth to protect Flower dashboard from public access.
    # Set FLOWER_USER and FLOWER_PASSWORD in your .env file.
    image: priceping-backend:latest
    container_name: priceping_flower
    restart: unless-stopped
    networks:
      - priceping_network
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5555/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    command: >-
      celery -A worker.celery_app flower
      --port=5555
      --address=0.0.0.0
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flowerpassword}

  # React Frontend (Self-contained Nginx Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: priceping-frontend:latest
    container_name: priceping_frontend
    restart: unless-stopped
    networks:
      - priceping_network
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

