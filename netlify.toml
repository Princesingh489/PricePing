[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Proxy /api requests directly to AWS EC2 (bypasses browser mixed-content blocks)
[[redirects]]
  from = "/api/*"
  to = "http://65.0.199.91:8000/api/:splat"
  status = 200
  force = true

# Single Page App fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

